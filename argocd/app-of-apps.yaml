apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crickethub-app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/crickethub.git
    targetRevision: main
    path: argocd
    directory: { recurse: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
