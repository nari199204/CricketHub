apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: crickethub-frontend, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/crickethub.git
    targetRevision: main
    path: k8s/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: crickethub
  syncPolicy:
    automated: { prune: true, selfHeal: true }
