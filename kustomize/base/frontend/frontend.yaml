apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crickethub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 114268015259.dkr.ecr.ap-south-1.amazonaws.com/crickethub/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: crickethub
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
