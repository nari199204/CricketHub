apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  namespace: crickethub
spec:
  replicas: 1
  selector: { matchLabels: { app: match-service } }
  template:
    metadata: { labels: { app: match-service } }
    spec:
      containers:
        - name: match-service
          image: 114268015259.dkr.ecr.ap-south-1.amazonaws.com/crickethub/match-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          env:
            - { name: PORT, value: "8083" }
            - { name: DB_HOST, value: "postgres" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "match_db" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: postgres-secret, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: match-service, namespace: crickethub }
spec:
  selector: { app: match-service }
  ports: [{ port: 8083, targetPort: 8083 }]
