apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-service
  namespace: crickethub
spec:
  replicas: 1
  selector: { matchLabels: { app: team-service } }
  template:
    metadata: { labels: { app: team-service } }
    spec:
      containers:
        - name: team-service
          image: crickethub/team-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - { name: PORT, value: "8082" }
            - { name: DB_HOST, value: "postgres" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "team_db" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: postgres-secret, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: team-service, namespace: crickethub }
spec:
  selector: { app: team-service }
  ports: [{ port: 8082, targetPort: 8082 }]
