apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: crickethub
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: 114268015259.dkr.ecr.ap-south-1.amazonaws.com/crickethub/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:8081" }
            - { name: TEAM_SERVICE_URL, value: "http://team-service:8082" }
            - { name: MATCH_SERVICE_URL, value: "http://match-service:8083" }
            - { name: SCORING_SERVICE_URL, value: "http://scoring-service:8084" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: postgres-secret, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: crickethub }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
