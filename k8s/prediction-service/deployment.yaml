apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  namespace: crickethub
spec:
  replicas: 2
  selector:
    matchLabels: { app: prediction-service }
  template:
    metadata:
      labels: { app: prediction-service }
    spec:
      containers:
        - name: prediction-service
          image: crickethub/prediction-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8085 }
          env:
            - { name: PORT, value: "8085" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }