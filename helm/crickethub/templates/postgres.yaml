      (8, 'Virat Kohli', 612, 410, 2, 24, 30, 13),
      (9, 'Glenn Maxwell', 388, 220, 7, 120, 145, 11)
    ON CONFLICT (player_id) DO NOTHING;

    \c prediction_db;

    CREATE TABLE IF NOT EXISTS predictions (
      id SERIAL PRIMARY KEY,
      match_id INT NOT NULL,
      user_id INT NOT NULL,
      prediction VARCHAR(255) NOT NULL,
      created_at TIMESTAMP DEFAULT NOW()
    );

    GRANT CONNECT ON DATABASE prediction_db TO crickethub;
    GRANT USAGE ON SCHEMA public TO crickethub;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO crickethub;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO crickethub;

    INSERT INTO predictions (match_id, user_id, prediction) VALUES
      (1, 1, 'Mumbai Strikers'),
      (2, 1, 'Chennai Kings');

    
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: aws-ebs }
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp2
  fstype: ext4
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: crickethub }
spec:
  storageClassName: aws-ebs
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: crickethub }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom: [{ secretRef: { name: postgres-secret } }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-pvc } }
        - { name: init, configMap: { name: postgres-init } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: crickethub }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
