    CREATE TABLE IF NOT EXISTS balls (
      id SERIAL PRIMARY KEY,
      innings_id INT REFERENCES innings(id) ON DELETE CASCADE,
      over_number INT NOT NULL,
      ball_number INT NOT NULL,
      batsman_id INT,
      bowler_id INT,
      runs INT DEFAULT 0,
      is_wicket BOOLEAN DEFAULT false,
      is_wide BOOLEAN DEFAULT false,
      is_no_ball BOOLEAN DEFAULT false,
      event VARCHAR(32),
      created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS player_stats (
      player_id INT PRIMARY KEY,
      player_name VARCHAR(255),
      runs_scored INT DEFAULT 0,
      balls_faced INT DEFAULT 0,
      wickets_taken INT DEFAULT 0,
      balls_bowled INT DEFAULT 0,
      runs_conceded INT DEFAULT 0,
      matches_played INT DEFAULT 0
    );

    GRANT CONNECT ON DATABASE scoring_db TO crickethub;
    GRANT USAGE ON SCHEMA public TO crickethub;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO crickethub;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO crickethub;

    INSERT INTO player_stats (player_id, player_name, runs_scored, balls_faced, wickets_taken, balls_bowled, runs_conceded, matches_played) VALUES
