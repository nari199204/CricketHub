apiVersion: v1
kind: Secret
metadata: { name: postgres-secret, namespace: crickethub }
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: crickethub
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: crickethub }
data:
  init.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE team_db;
    CREATE DATABASE match_db;
    CREATE DATABASE scoring_db;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: crickethub }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: crickethub }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-secret } }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-pvc } }
        - { name: init, configMap: { name: postgres-init } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: crickethub }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
