{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .name }}, namespace: crickethub }
spec:
  replicas: {{ .replicas }}
  selector: { matchLabels: { app: {{ .name }} } }
  template:
    metadata: { labels: { app: {{ .name }} } }
    spec:
      containers:
        - name: {{ .name }}
          {{- $override := index $.Values.image.overrides .name }}
          {{- if $override }}
          image: "{{ $override.registry }}:{{ $override.tag }}"
          {{- else }}
          image: "{{ $.Values.image.registry }}/{{ .name }}:{{ $.Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .port }} }]
          env:
            - { name: PORT, value: "{{ .port }}" }
            - { name: DB_HOST, value: "postgres" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "{{ .db }}" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: postgres-secret, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: {{ .port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: {{ .name }}, namespace: crickethub }
spec:
  selector: { app: {{ .name }} }
  ports: [{ port: {{ .port }}, targetPort: {{ .port }} }]
{{- end }}
