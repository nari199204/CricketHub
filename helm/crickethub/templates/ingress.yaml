{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crickethub-ingress
  namespace: crickethub
  {{- if eq .Values.ingress.type "alb" }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/tags: Environment=dev,App=crickethub
  {{- else }}
  annotations:
    kubernetes.io/ingress.class: nginx
  {{- end }}
spec:
  {{- if ne .Values.ingress.type "alb" }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
        host: {{ .Values.ingress.host }}
      {{- end }}
        http:
          paths:
            - path: /api
              pathType: Prefix
              backend:
                service: { name: api-gateway, port: { number: {{ .Values.gateway.port }} } }
            - path: /
              pathType: Prefix
              backend:
                service: { name: frontend, port: { number: {{ .Values.frontend.port }} } }
{{- end }}
