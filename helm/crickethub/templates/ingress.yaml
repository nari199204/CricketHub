{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crickethub-ingress
  namespace: crickethub
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: {{ .Values.gateway.port }} } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: {{ .Values.frontend.port }} } }
{{- end }}
