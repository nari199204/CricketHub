apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: crickethub }
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.image.registry }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.gateway.port }} }]
          env:
            - { name: PORT, value: "{{ .Values.gateway.port }}" }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:8081" }
            - { name: TEAM_SERVICE_URL, value: "http://team-service:8082" }
            - { name: MATCH_SERVICE_URL, value: "http://match-service:8083" }
            - { name: SCORING_SERVICE_URL, value: "http://scoring-service:8084" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: postgres-secret, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.gateway.port }} }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: crickethub }
spec:
  selector: { app: api-gateway }
  ports: [{ port: {{ .Values.gateway.port }}, targetPort: {{ .Values.gateway.port }} }]
